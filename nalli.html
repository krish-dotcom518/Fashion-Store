<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique Collection – Nalli</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="js/voice-nav.js"></script>

  <style>
    body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #f6d365, #fda085, #f093fb, #c3cfe2);
  background-size: 400% 400%;
  animation: gradientFlow 15s ease infinite;
  color: #333;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


    header {
  background: linear-gradient(to bottom, rgba(255, 179, 71, 0.7), rgba(255, 94, 98, 0.7)),
              url('images/nalli-dubai.webp') center/cover no-repeat;
  padding: 10px 5px;
  text-align: center;
  color: white;
  background-blend-mode: overlay;



    .nalli-logo {
      height: 80px;
      width: 200px;
      margin-right: 80px;
    }

    .tagline {
      font-size: 2rem;
      color: #333;
      font-family: 'Segoe UI', sans-serif;
    }
}

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }

    .collection-item {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .collection-item:hover {
      transform: scale(1.03);
    }

    .collection-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .info {
      padding: 12px;
    }

    .price {
      font-weight: bold;
      font-size: 1.1rem;
      color: #8e44ad;
      margin-bottom: 6px;
    }

    .rating {
      color: gold;
      font-size: 0.9rem;
    }

    .order-btn {
      background-color: #8e44ad;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      margin: 10px auto 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .order-btn:hover {
      background-color: #732d91;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: #8e44ad;
    }

    .modal-content form input,
    .modal-content form textarea {
      width: 100%;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .modal-content button {
      padding: 10px 20px;
      background-color: #8e44ad;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-content button:hover {
      background-color: #6e3391;
    }

    .close-btn {
      margin-top: 10px;
      background: #ccc !important;
      color: #333 !important;
    }

    #confirmation {
      display: none;
      font-size: 1rem;
      color: green;
      margin-top: 10px;
    }

    #camera {
      width: 100%;
      height: 180px;
      display: none;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    #faceStatus {
      color: green;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <header>
  <img src="images/nalli-logo-png.png" alt="Nalli Logo" class="nalli-logo" />
  <p class="tagline">Discover curated styles from here</p>
</header>

  <section class="collection-grid">
    <div class="collection-item">
      <img src="images/nalli4.jpeg" alt="Banaras Silk Sarees">
      <div class="info">
        <div class="price">₹699</div>
        <div class="rating">★★★★☆ (4.2)</div>
        <button class="order-btn" onclick="openModal('Banaras Silk saree', 699)">Place My Order</button>
      </div>
    </div>

    <div class="collection-item">
      <img src="images/nalli3.webp" alt="Poonam saree">
      <div class="info">
        <div class="price">₹1499</div>
        <div class="rating">★★★★★ (4.8)</div>
        <button class="order-btn" onclick="openModal('Poonam saree', 1499)">Place My Order</button>
      </div>
    </div>

    <div class="collection-item">
      <img src="images/nalli2.jpg" alt="Copper silk saree">
      <div class="info">
        <div class="price">₹899</div>
        <div class="rating">★★★☆☆ (3.9)</div>
        <button class="order-btn" onclick="openModal('Copper silk saree', 899)">Place My Order</button>
      </div>
    </div>

    <div class="collection-item">
      <img src="images/nalli1.webp" alt="Kanchi silk saree">
      <div class="info">
        <div class="price">₹1299</div>
        <div class="rating">★★★★☆ (4.4)</div>
        <button class="order-btn" onclick="openModal('Kanchi Silk Saree', 1299)">Place My Order</button>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <h3>🛒 Complete Your Order</h3>
      <p id="selectedItem">Item: -</p>
      <form onsubmit="submitOrder(event)">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="text" id="address" placeholder="Shipping Address" required />
        <input type="tel" id="phone" placeholder="Phone Number" required />
        <input type="email" id="email" placeholder="Email" required />

        <label>
          <input type="checkbox" id="faceID" onchange="handleFaceID()" />
          Use Face ID for instant checkout
        </label><br><br>

        <video id="camera" autoplay muted></video>
        <div id="faceStatus">✅ Face Verified</div>

        <input type="text" id="upi" placeholder="Enter UPI ID or Card Last 4 Digits" required />

        <button type="submit">Pay & Order</button>
        <div id="confirmation">✅ Payment successful & order placed!</div>
        <button type="button" class="close-btn" onclick="closeModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    let selectedItem = '';
let stream = null;
let faceVerified = false;

function generateRefID() {
  return 'FCE' + Math.floor(1000 + Math.random() * 9000);
}

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
  console.log("✅ Face API models loaded");
}



async function handleFaceID() {
  const useFaceID = document.getElementById("faceID").checked;
  const camera = document.getElementById("camera");
  const faceStatus = document.getElementById("faceStatus");
  const upiInput = document.getElementById("upi");

  if (useFaceID) {
    faceVerified = false;
    upiInput.disabled = true;
    camera.style.display = "block";
    faceStatus.style.display = "block";
    faceStatus.textContent = "🔍 Scanning your face...";

    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    camera.srcObject = stream;

    const interval = setInterval(async () => {
      const detections = await faceapi.detectAllFaces(camera, new faceapi.TinyFaceDetectorOptions());
      if (detections.length > 0) {
        faceVerified = true;
        faceStatus.textContent = "✅ Face matched";
        clearInterval(interval);
      }
    }, 1500);
  } else {
    upiInput.disabled = false;
    camera.style.display = "none";
    faceStatus.style.display = "none";
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    faceVerified = false;
  }
}

function openModal(itemName, price) {
  selectedItem = `${itemName} – ₹${price}`;
  document.getElementById("selectedItem").textContent = `Item: ${selectedItem}`;
  document.getElementById("orderModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("orderModal").style.display = "none";
  document.getElementById("confirmation").style.display = "none";
  document.querySelector("#orderModal form").reset();
  document.getElementById("camera").style.display = "none";
  document.getElementById("faceStatus").style.display = "none";
  document.getElementById("upi").disabled = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
}

function submitOrder(e) {
  e.preventDefault();
  const name = document.getElementById("name").value;
  const upi = document.getElementById("upi").value;
  const faceID = document.getElementById("faceID").checked;

  if (faceID && !faceVerified) {
    alert("Face ID not verified. Please wait...");
    return;
  }

  const refID = generateRefID();
  const method = faceID ? "Face ID" : "UPI/Card";
  const amt = selectedItem.match(/₹\d+/)[0];
  const msg = `${amt} debited via ${method} (Ref: ${refID})\n\nPayment Successful.\nThank you, ${name}!`;

  document.getElementById("confirmation").style.display = "block";

  setTimeout(() => {
    alert(msg);
    closeModal();
  }, 1200);
}

window.onload = loadModels;

window.onclick = function(e) {
  const modal = document.getElementById('orderModal');
  if (e.target === modal) closeModal();
};

  </script>

</body>
</html>
